name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      NX_DAEMON: false
      NEXT_TELEMETRY_DISABLED: 1
      NAVFARM_API_MODE: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm Nx web project
        run: pnpm nx show projects

      - name: Typecheck web
        run: pnpm nx run web:typecheck --skipNxCache

      - name: Lint web
        run: pnpm nx run web:lint --skipNxCache

      - name: Test web
        run: pnpm nx run web:test --skipNxCache

      - name: Build web
        run: pnpm nx run web:build --skipNxCache
